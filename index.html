<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap">
<script src="script.js"></script>
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<script src="auth.js"></script>





<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Practice</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="logo"></div>

 <div class="container">
     <h1 class="title">Typing Practice</h1>
     <div id="top-buttons">
         <button id="new-text-btn"><i class='bx bx-repeat'></i>
             New Text</button>
         <button id="account-btn" onclick="window.location.href='login_page.html'">
             <i class='bx bxs-user'></i>Account</button>
             </div>
     </div>

   <div class="typing-box">
       <p id="text-display">
           Start typing ...
       </p>
       <label for="input-field"></label><input id="input-field" type="text" autocomplete="off" autofocus />
   </div>

<p id="sample-text">Text wird hier erscheinen...</p>
     <div class="stats">
         <div>WPM: <span id="wpm">0</span></div>
         <div>Accuracy: <span id="accuracy">100</span>%</div>
         <div>Time: <span id="time">60</span>s</div>
     </div>

     <div id="keyboard-container">
         <div class="key" data-key="q">Q</div>
         <div class="key" data-key="w">W</div>
         <div class="key" data-key="e">E</div>
         <div class="key" data-key="r">R</div>
         <div class="key" data-key="t">T</div>
         <div class="key" data-key="y">Y</div>
         <div class="key" data-key="u">U</div>
         <div class="key" data-key="i">I</div>
         <div class="key" data-key="o">O</div>
         <div class="key" data-key="p">P</div>
         <div class="key" data-key="a">A</div>
         <div class="key" data-key="s">S</div>
         <div class="key" data-key="d">D</div>
         <div class="key" data-key="f">F</div>
         <div class="key" data-key="g">G</div>
         <div class="key" data-key="h">H</div>
         <div class="key" data-key="j">J</div>
         <div class="key" data-key="k">K</div>
         <div class="key" data-key="l">L</div>
         <div class="key" data-key="z">Z</div>
         <div class="key" data-key="x">X</div>
         <div class="key" data-key="c">C</div>
         <div class="key" data-key="v">V</div>
         <div class="key" data-key="b">B</div>
         <div class="key" data-key="n">N</div>
         <div class="key" data-key="m">M</div>
         <div class="key" data-key=" ">Space</div>
         <div class="key" data-key="enter">Enter</div>
         <div class="key" data-key=",">,</div>
         <div class="key" data-key=".">.</div>
     </div>
</body>

</html>
